name: WINDOWS RDP - CLOUDFLARE
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Restart-Service TermService -Force
          Start-Sleep -Seconds 3
          netstat -ano | findstr :3389
          Write-Host "✅ RDP Enabled!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Configured!"

      - name: Start Cloudflare Tunnel (detached)
        run: |
          Write-Host "Starting tunnel..."
          # Run cloudflared as a detached background process
          Start-Process -FilePath "cloudflared" `
            -ArgumentList "tunnel","--url","tcp://localhost:3389","--no-autoupdate" `
            -RedirectStandardOutput "C:\tunnel.log" `
            -RedirectStandardError "C:\tunnel-err.log" `
            -WindowStyle Hidden
          Start-Sleep -Seconds 25

          Write-Host "============================================"
          Write-Host "🌐 CLOUDFLARE TUNNEL URL:"
          Write-Host "============================================"
          $url = Select-String -Path "C:\tunnel.log","C:\tunnel-err.log" -Pattern "trycloudflare.com" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($url) {
            Write-Host $url.Line
          } else {
            Write-Host "Log contents:"
            Get-Content C:\tunnel.log -ErrorAction SilentlyContinue
            Get-Content C:\tunnel-err.log -ErrorAction SilentlyContinue
          }
          Write-Host "============================================"

      - name: Keep Session Alive
        run: |
          Write-Host "⏳ Keeping session alive for 6 hours..."
          $start = Get-Date
          while (((Get-Date) - $start).TotalHours -lt 5.9) {
            Start-Sleep -Seconds 60
            $cf = Get-Process cloudflared -ErrorAction SilentlyContinue
            if ($cf) {
              Write-Host "✓ $(Get-Date -Format 'HH:mm:ss') - cloudflared running (PID $($cf.Id))"
            } else {
              Write-Host "❌ $(Get-Date -Format 'HH:mm:ss') - cloudflared DIED, restarting..."
              Start-Process -FilePath "cloudflared" `
                -ArgumentList "tunnel","--url","tcp://localhost:3389","--no-autoupdate" `
                -RedirectStandardOutput "C:\tunnel.log" `
                -RedirectStandardError "C:\tunnel-err.log" `
                -WindowStyle Hidden
              Start-Sleep -Seconds 20
              Get-Content C:\tunnel.log,C:\tunnel-err.log -ErrorAction SilentlyContinue | Select-String "trycloudflare"
            }
          }
